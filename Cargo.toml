[workspace]
resolver = "2"
members = ["crates/wp-core", "crates/wp-docx", "crates/wp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aykroyd/wp"

[workspace.dependencies]
wp-core = { path = "crates/wp-core" }
wp-docx = { path = "crates/wp-docx" }
crossterm = "0.28"
ratatui = "0.29"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
